services:

  api:
    build: .
    image: smartcampus:1.0
    container_name: smartcampus-api

    ports:
      - "8082:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/smartcampus
      SPRING_DATASOURCE_USERNAME: smartcampus
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - smartcampus-data:/app/data

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8080' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

    restart: unless-stopped

  db:
    # image: postgres:16-alpine
    # container_name: smartcampus-db
    # ports:
    #   - "5432:5432"
    image: postgres:16-alpine
    container_name: smartcampus-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: smartcampus
      POSTGRES_USER: smartcampus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartcampus -d smartcampus"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

    restart: unless-stopped

volumes:
  postgres_data:
  smartcampus-data: